# Build `docker/dockerfile` from a released `dsh` CLI bundle and publish it to
# Docker Hub and Aliyun ACR under the `latest` tag.
#
# Started by hand with the version of an existing release, so the
# `dsh-v<version>.zip` asset that `release-cli-archive.yml` attaches to that
# release is already there when the image unpacks it.
name: Release Docker image (dsh)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released CLI version to build, e.g. 0.1.10
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # `latest` is one shared tag in two registries. A re-run replaces the tag it
  # owns and never cancels a publication already in flight.
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPO: wybioinfo/dsh
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_REPO: registry.cn-hangzhou.aliyuncs.com/wybioinfo/dsh
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-24.04
    # Bounds the apt, Node.js, and image layers of the build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve the released version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          # The build arg becomes the download path of a release asset, so an
          # unsupported value must fail here rather than inside the image build.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a released dsh version such as 0.1.10 or 0.2.0-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The image installs that release's archive, so a version without one fails
      # here in seconds instead of after the apt and Node.js layers.
      - name: Verify the release carries the CLI archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="dsh-v$VERSION"
          if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$tag.zip"; then
            echo "::error::$tag.zip is not attached to the $tag release"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build the image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: docker build --build-arg "DSH_VERSION=$VERSION" -t "dsh:$VERSION" docker

      # `docker/dockerfile` unpacks the release archive without running it, so a
      # mismatch between the tag and the bundled CLI is only visible here.
      - name: Verify the bundled CLI reports the released version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          reported=$(docker run --rm --entrypoint /usr/local/bin/dsh "dsh:$VERSION" --version)
          if [[ "$reported" != "$VERSION" ]]; then
            echo "::error::the image reports dsh $reported, expected $VERSION"
            exit 1
          fi

      # Every build replaces `latest`; version-named tags would accumulate image
      # copies neither registry's retention policy is set up to prune.
      - name: Publish to Docker Hub and Aliyun ACR
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for repo in "$DOCKERHUB_REPO" "$ACR_REPO"; do
            docker tag "dsh:$VERSION" "$repo:latest"
            docker push "$repo:latest"
          done
